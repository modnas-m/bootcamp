<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>María Sánchez Domínguez</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 340px;
            background-color: #f5f5f5;
            padding: 40px 30px;
            border-right: 3px solid #e74c3c;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .profile-circle {
            width: 210px;
            height: 210px;
            background-color: #d0d0d0;
            border-radius: 50%;
            margin-bottom: 25px;
        }

        .cv-button {
            background-color: #000;
            color: #fff;
            padding: 12px 40px;
            border: none;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 35px;
            letter-spacing: 2px;
        }

        .description {
            font-size: 13px;
            line-height: 1.6;
            text-align: justify;
            margin-bottom: 40px;
            color: #333;
        }

        .social-buttons {
            display: flex;
            gap: 20px;
        }

        .social-btn {
            width: 35px;
            height: 35px;
            background-color: #000;
            border: none;
            cursor: pointer;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .navigation {
            display: flex;
            justify-content: center;
            gap: 80px;
            padding: 40px 0;
        }

        .nav-link {
            text-decoration: none;
            color: #000;
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .nav-link:hover {
            color: #e74c3c;
        }

        .center-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .main-title {
            font-size: 48px;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 15px;
        }

        .subtitle {
            font-size: 16px;
            color: #666;
        }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="profile-circle"></div>
        <button class="cv-button">CV</button>
        <p class="description">
            Lorem ipsum dolor sit amet consectetur adipiscing elit blandit rhoncus ultrices 
            cubilia, conubia tempor tortor pellentesque sollicitudin ac suspendisse 
            ullamcorper facilisi.
        </p>
        <div class="social-buttons">
            <button class="social-btn"></button>
            <button class="social-btn"></button>
            <button class="social-btn"></button>
            <button class="social-btn"></button>
        </div>
    </aside>

    <main class="main-content">
        <nav class="navigation">
            <a href="about.html" class="nav-link">ABOUT</a>
            <a href="work.html" class="nav-link">WORK</a>
            <a href="index.html" class="nav-link">HOME</a>
        </nav>

        <div class="center-content">
            <h1 class="main-title">MARÍA SÁNCHEZ DOMÍNGUEZ</h1>
            <p class="subtitle">Architecture / Computational Design</p>
        </div>
    </main>
</body>
</html>
